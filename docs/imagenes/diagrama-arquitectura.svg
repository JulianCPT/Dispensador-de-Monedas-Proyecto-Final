<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="Segoe UI, Roboto, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="flecha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#445"/>
    </marker>
    <marker id="flecha-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a94a6"/>
    </marker>
  </defs>

  <rect width="960" height="560" rx="18" fill="#f6f8fb"/>
  <text x="480" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#12263f">Sistema de Logística de Monedas Inteligentes</text>

  <!-- PC: simulación -->
  <rect x="24" y="52" width="912" height="190" rx="14" fill="#eaf2ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="40" y="76" font-size="14" font-weight="700" fill="#1d4ed8">PC · sim_monedas.py (PyBullet)</text>

  <g font-size="13" font-weight="600" fill="#12263f" text-anchor="middle">
    <rect x="44"  y="100" width="148" height="88" rx="10" fill="#fff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="118" y="132">Separador</text>
    <text x="118" y="150" font-weight="400" font-size="12">5 canales + sensor</text>
    <text x="118" y="168" font-weight="400" font-size="12">1 vaso por moneda</text>

    <rect x="226" y="100" width="148" height="88" rx="10" fill="#fff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="300" y="132">Banda</text>
    <text x="300" y="150" font-weight="400" font-size="12">transporta los vasos</text>
    <text x="300" y="168" font-weight="400" font-size="12">con cola y paradas</text>

    <rect x="408" y="100" width="148" height="88" rx="10" fill="#fff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="482" y="132">Brazo de tapas</text>
    <text x="482" y="150" font-weight="400" font-size="12">toma y coloca</text>
    <text x="482" y="168" font-weight="400" font-size="12">la tapa del vaso</text>

    <rect x="590" y="100" width="148" height="88" rx="10" fill="#fff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="664" y="132">Minitanque</text>
    <text x="664" y="150" font-weight="400" font-size="12">orugas + pinza</text>
    <text x="664" y="168" font-weight="400" font-size="12">esquiva 3 obstáculos</text>

    <rect x="772" y="100" width="144" height="88" rx="10" fill="#fff" stroke="#16a34a" stroke-width="1.5"/>
    <text x="844" y="132">Meta</text>
    <text x="844" y="150" font-weight="400" font-size="12">entrega de vasos</text>
    <text x="844" y="168" font-weight="400" font-size="12">y regreso por más</text>
  </g>
  <g stroke="#445" stroke-width="2" marker-end="url(#flecha)">
    <line x1="194" y1="144" x2="224" y2="144"/>
    <line x1="376" y1="144" x2="406" y2="144"/>
    <line x1="558" y1="144" x2="588" y2="144"/>
    <line x1="740" y1="144" x2="770" y2="144"/>
  </g>
  <text x="480" y="226" text-anchor="middle" font-size="12" fill="#1d4ed8">monedas → vasos → tapas → tanque → meta (todo alineado sobre el eje de la banda)</text>

  <!-- estado.json -->
  <line x1="480" y1="244" x2="480" y2="292" stroke="#445" stroke-width="2" marker-end="url(#flecha)"/>
  <rect x="360" y="294" width="240" height="56" rx="10" fill="#fff4e5" stroke="#f59e0b" stroke-width="2"/>
  <text x="480" y="318" text-anchor="middle" font-size="14" font-weight="700" fill="#92400e">estado.json</text>
  <text x="480" y="337" text-anchor="middle" font-size="12" fill="#92400e">se actualiza cada ~0.25 s</text>

  <!-- ESP32 (en desarrollo) -->
  <rect x="44" y="290" width="230" height="84" rx="10" fill="#fff" stroke="#8a94a6" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="159" y="318" text-anchor="middle" font-size="14" font-weight="700" fill="#556">ESP32 (en desarrollo)</text>
  <text x="159" y="338" text-anchor="middle" font-size="12" fill="#667">sensores, servos y motores</text>
  <text x="159" y="356" text-anchor="middle" font-size="12" fill="#667">expone el mismo JSON por Wi-Fi</text>
  <line x1="276" y1="334" x2="358" y2="334" stroke="#8a94a6" stroke-width="2" stroke-dasharray="8 6" marker-end="url(#flecha-g)"/>
  <text x="317" y="324" text-anchor="middle" font-size="11" fill="#667">HTTP</text>

  <!-- Streamlit -->
  <line x1="480" y1="352" x2="480" y2="392" stroke="#445" stroke-width="2" marker-end="url(#flecha)"/>
  <rect x="300" y="394" width="360" height="86" rx="12" fill="#f3e8ff" stroke="#9333ea" stroke-width="2"/>
  <text x="480" y="420" text-anchor="middle" font-size="14" font-weight="700" fill="#6b21a8">app_streamlit.py</text>
  <text x="480" y="440" text-anchor="middle" font-size="12" fill="#6b21a8">Dashboard · Ruta · Simulación 3D · Asistente</text>
  <text x="480" y="458" text-anchor="middle" font-size="12" fill="#6b21a8">fuentes: Auto · Archivo · ESP32 (URL) · Demo</text>

  <!-- Usuario -->
  <line x1="480" y1="482" x2="480" y2="506" stroke="#445" stroke-width="2" marker-end="url(#flecha)"/>
  <rect x="330" y="508" width="300" height="40" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="480" y="533" text-anchor="middle" font-size="14" font-weight="700" fill="#166534">Navegador · computador o celular</text>

  <!-- Leyenda -->
  <g font-size="12" fill="#334">
    <rect x="720" y="296" width="14" height="14" rx="3" fill="#eaf2ff" stroke="#3b82f6"/><text x="742" y="308">Simulación (PyBullet)</text>
    <rect x="720" y="318" width="14" height="14" rx="3" fill="#fff4e5" stroke="#f59e0b"/><text x="742" y="330">Canal de datos (JSON)</text>
    <rect x="720" y="340" width="14" height="14" rx="3" fill="#f3e8ff" stroke="#9333ea"/><text x="742" y="352">Dashboard (Streamlit)</text>
    <rect x="720" y="362" width="14" height="14" rx="3" fill="#dcfce7" stroke="#16a34a"/><text x="742" y="374">Usuario / destino final</text>
    <rect x="720" y="384" width="14" height="14" rx="3" fill="#fff" stroke="#8a94a6" stroke-dasharray="3 2"/><text x="742" y="396">Pendiente (hardware real)</text>
  </g>
</svg>
